description: A user in the merchant's system as the payer
allOf:
  - $ref: "#/definitions/ClientIdentity"
  - type: object
    required:
      - userID
    properties:
      userID:
        x-rebillyMerge:
          - $ref: "#/definitions/ExternalID"
