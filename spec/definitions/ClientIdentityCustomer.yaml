description: An existing customer as the payer
allOf:
  - $ref: "#/definitions/ClientIdentity"
  - type: object
    required:
      - customerID
    properties:
      customerID:
        description: >
          Identifier of an existing customer to associate the invoice payments with
        type: string
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
