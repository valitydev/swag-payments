type: object
required:
  - flow
  - payer
properties:
  externalID:
    x-rebillyMerge:
      - $ref: "#/definitions/ExternalID"
  flow:
    $ref: "#/definitions/PaymentFlow"
  payer:
    $ref: "#/definitions/Payer"
  processingDeadline:
    x-rebillyMerge:
      - $ref: "#/definitions/ProcessingDeadline"
  makeRecurrent:
    x-rebillyMerge:
      - $ref: "#/definitions/PaymentMakeRecurrent"
  customerAccessToken:
    description: >
      Customer access token. When provided, the payment and any resulting
      recurrent tokens will be associated with the customer. If not
      provided and makeRecurrent is true, a new customer will be created.
    type: string
  metadata:
    description: Metadata to be linked with the payment
    type: object
