type: object
required:
  - flow
  - payer
properties:
  externalID:
    x-rebillyMerge:
      - $ref: "#/definitions/ExternalID"
  flow:
    $ref: "#/definitions/PaymentFlow"
  payer:
    $ref: "#/definitions/Payer"
  processingDeadline:
    x-rebillyMerge:
      - $ref: "#/definitions/ProcessingDeadline"
  makeRecurrent:
    x-rebillyMerge:
      - $ref: "#/definitions/PaymentMakeRecurrent"
  customerID:
    description: Customer ID
    type: string
  userID:
    x-rebillyMerge:
      - $ref: "#/definitions/ExternalID"
      - description: >
          Payer identifier in the merchant's system.

          Used to find or create a Customer with the same `userID`
          within the invoice's party.
  metadata:
    description: Metadata to be linked with the payment
    type: object
