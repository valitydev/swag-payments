post:
  operationId: createInvoiceUrl
  description: Construct an URL for invoice payment with set of optional query parameters.
  tags:
    - Invoices
  parameters:
    - $ref: "#/parameters/requestID"
    - $ref: "#/parameters/deadline"
    - $ref: "#/parameters/invoiceID"
    - name: params
      in: body
      description: Payment forms's prefill parameters
      required: true
      schema:
        type: object
        required: []
        additionalProperties: true
        properties: {}
        example:
          locale: "en-US"
          theme: "tomorrow-night"
  responses:
    "201":
      description: Invoice's payment URL is constructed.
      schema:
        type: object
        required:
          - url
        properties:
          url:
            description: >
              Invoice's payment URL
            type: string
            example: "https://shop-specific-example.com/path/to/checkout?locale=en-US&theme=tomorrow-night"
    "404":
      $ref: "#/responses/NotFound"
    "401":
      $ref: "#/responses/Unauthorized"
    "400":
      $ref: "#/responses/DefaultLogicError"
