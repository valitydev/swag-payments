# FIXME naming sucks
post:
  operationId: createInvoiceCheckoutUrl
  description: Create a new checkout url for invoice payment with set of optional query parameters.
  tags:
    - Invoices
  parameters:
    - $ref: "#/parameters/requestID"
    - $ref: "#/parameters/deadline"
    - $ref: "#/parameters/invoiceID"
    # TODO Move into parameters subset in main spec document
    - name: checkoutParameters
      in: body
      description: Checkout forms's prefill parameters
      required: true
      schema:
        type: object
        required: []
        additionalProperties: true
        properties: {}
        # TODO Type provide example
        example: {}
  responses:
    "201":
      description: Invoice's checkout URL is created.
      schema:
        # TODO Move to dedicated schema reference yaml document
        type: object
        required:
          - checkoutUrl
        properties:
          checkoutUrl:
            description: >
              Invoice's checkout URL
            type: string
            # TODO Provide example
            example: "string"
    "404":
      $ref: "#/responses/NotFound"
    "401":
      $ref: "#/responses/Unauthorized"
    "400":
      $ref: "#/responses/DefaultLogicError"
