get:
  description: Get customer by specified external identifier.
  tags:
    - Customers
  operationId: getCustomerByExternalID
  parameters:
    - $ref: "#/parameters/requestID"
    - $ref: "#/parameters/deadline"
    - x-rebillyMerge:
        - $ref: "#/parameters/externalID"
        - description: External customer identifier
    - x-rebillyMerge:
        - $ref: "#/parameters/partyID"
        - in: query
          required: false
  responses:
    "200":
      description: Customer
      schema:
        $ref: "#/definitions/Customer"
    "404":
      $ref: "#/responses/NotFound"
    "401":
      $ref: "#/responses/Unauthorized"
    "400":
      $ref: "#/responses/DefaultLogicError"
post:
  description: Create a new customer.
  tags:
    - Customers
  operationId: createCustomer
  parameters:
    - $ref: "#/parameters/requestID"
    - $ref: "#/parameters/deadline"
    - name: customerParams
      description: Customer parameters
      in: body
      required: true
      schema:
        $ref: "#/definitions/CustomerParams"
  responses:
    "201":
      description: Customer created
      schema:
        $ref: "#/definitions/CustomerAndToken"
    "401":
      $ref: "#/responses/Unauthorized"
    "400":
      description: Invalid data for customer creation
      schema:
        type: object
        required:
          - code
          - message
        properties:
          code:
            description: >
              [Error code](#tag/Error-Codes)
            type: string
            enum:
              - invalidPartyID
              - invalidRequest
              - invalidDeadline
              - invalidPartyStatus
              - ambiguousPartyID
          message:
            description: Human-readable description of the error
            type: string
            example: Party not found or inaccessible
    "409":
      $ref: "#/responses/ExternalIDConflict"
