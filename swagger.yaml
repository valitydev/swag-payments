        properties:
          rate:
            description: Tax rate
            type: string
            enum:
              - 0%
              - 10%
              - 18%
              - 20%
              - 10/110
              - 18/118
              - 20/120
  InvoiceParams:
    type: object
    required:
      - shopID
      - dueDate
      - currency
      - product
      - metadata
    properties:
      shopID:
        description: Shop ID
        type: string
        maxLength: 40
        minLength: 1
