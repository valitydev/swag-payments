          - gatewayMerchantID
          - paymentToken
        properties:
          gatewayMerchantID:
            description: Merchant identifier in the system
            type: string
          paymentToken:
            description: Aggregate of open and encrypted payment data
            type: object
  Invoice:
    type: object
    required:
      - id
      - shopID
      - createdAt
      - dueDate
      - amount
      - currency
      - product
      - metadata
      - status
    properties:
      id:
        description: Invoice ID
        type: string
      shopID:
        description: Shop ID
        type: string
      externalID:
        description: External invoice identifier
        type: string
        maxLength: 40
        minLength: 1
      createdAt:
        description: Created at
        type: string
        format: date-time
      dueDate:
        description: Expiration date and time
        type: string
        format: date-time
      amount:
        description: |
          The price of the goods or services offered, in minor monetary units, e.g. cents if U.S. dollars are specified as the currency
        type: integer
        format: int64
        minimum: 1
      currency:
        description: |
          Currency character code according to [ISO 4217](http://www.iso.org/iso/home/standards/currency_codes.htm).
        type: string
        pattern: '^[A-Z]{3}$'
      product:
        description: Name of the offered goods or services
