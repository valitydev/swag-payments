definitions:
  AccessToken:
    type: object
    required:
      - payload
    properties:
      payload:
        description: |
          Access token payload
        type: string
  Allocation:
    description: |
      Allocation of cash
    type: array
    minItems: 1
    maxItems: 100
    items:
      $ref: '#/definitions/AllocationTransaction'
  AllocationBodyAmount:
    description: Allocation body amount
    allOf:
      - $ref: '#/definitions/AllocationTransaction'
      - type: object
        required:
          - amount
          - currency
        properties:
          amount:
            description: |
              The amount transferred to the selected destination in minor monetary units, e.g. cents if US dollars are specified as the currency.
            type: integer
            format: int64
            minimum: 1
          currency:
            description: |
              Currency character code according to [ISO 4217](http://www.iso.org/iso/home/standards/currency_codes.htm).
            type: string
            pattern: '^[A-Z]{3}$'
  AllocationBodyTotal:
    description: Transaction body with fee indication
    allOf:
      - $ref: '#/definitions/AllocationTransaction'
      - type: object
        required:
          - total
          - currency
          - fee
        properties:
          total:
            description: |
              Total transaction amount (includes fees) in minor monetary units, e.g. cents if US dollars are specified as the currency.
            type: integer
            format: int64
            minimum: 1
          amount:
            description: |
              The amount transferred to the selected destination in minor monetary units, e.g. cents if US dollars are specified as the currency.
            type: integer
            format: int64
            minimum: 1
            readOnly: true
          currency:
            description: |
              Currency character code according to [ISO 4217](http://www.iso.org/iso/home/standards/currency_codes.htm).
            type: string
            pattern: '^[A-Z]{3}$'
          fee:
            $ref: '#/definitions/AllocationFee'
  AllocationFee:
    description: Transaction fee
    type: object
    discriminator: allocationFeeType
    required:
      - allocationFeeType
    properties:
      target:
        description: Target of the transaction
        type: object
        discriminator: allocationTargetType
        required:
          - allocationTargetType
        properties:
          allocationTargetType:
            type: string
            enum:
              - AllocationTargetShop
        readOnly: true
      allocationFeeType:
        type: string
        enum:
          - AllocationFeeFixed
          - AllocationFeeShare
  AllocationFeeFixed:
    description: Transaction fee in absolute values
    allOf:
      - $ref: '#/definitions/AllocationFee'
      - type: object
        required:
          - amount
        properties:
          amount:
            description: |
              The value of the fee in minor monetary units, e.g. cents if US dollars are specified as the transaction currency.
            type: integer
            format: int64
            minimum: 1
  AllocationFeeShare:
    description: Transaction fee in relative values
    allOf:
      - $ref: '#/definitions/AllocationFee'
      - type: object
        required:
          - share
        properties:
          share:
            $ref: '#/definitions/Decimal'
          amount:
            description: |
              The value of the fee in minor monetary units, e.g. cents if US dollars are specified as the transaction currency.
            type: integer
            format: int64
            minimum: 1
            readOnly: true
  AllocationTarget:
    description: Target of the transaction
    type: object
    discriminator: allocationTargetType
    required:
      - allocationTargetType
    properties:
      allocationTargetType:
        type: string
        enum:
          - AllocationTargetShop
  AllocationTargetShop:
    description: The shop as the target of the transaction
    allOf:
      - $ref: '#/definitions/AllocationTarget'
      - type: object
        required:
          - shopID
        properties:
          shopID:
            description: Shop ID
            type: string
            maxLength: 40
            minLength: 1
  AllocationTransaction:
    description: Cash allocation transaction
    type: object
    discriminator: allocationBodyType
    required:
      - target
      - allocationBodyType
    properties:
      target:
        $ref: '#/definitions/AllocationTarget'
      allocationBodyType:
        description: Transaction body
        type: string
        enum:
          - AllocationBodyAmount
          - AllocationBodyTotal
      cart:
        $ref: '#/definitions/InvoiceCart'
  ApiExtensionRequest:
    type: object
    allOf:
      - $ref: '#/definitions/UserInteraction'
      - type: object
        required:
          - apiType
        properties:
          apiType:
            description: API type to use in subsequent requests
            type: string
  ApplePay:
    type: object
    allOf:
      - $ref: '#/definitions/TokenizedCardData'
      - type: object
        description: Apple Pay data
        required:
          - merchantID
          - paymentToken
        properties:
          merchantID:
            description: Apple Pay merchant identifier
            type: string
          paymentToken:
            description: Aggregate of open and encrypted payment data
            type: object
  BankCard:
    type: object
    allOf:
      - $ref: '#/definitions/PaymentMethod'
      - type: object
        required:
          - paymentSystems
        properties:
          paymentSystems:
            description: List of payment systems
            type: array
            items:
              description: |
                Payment system.
                The list of systems available for making payments can be found by calling the corresponding [operation](#operation/getInvoicePaymentMethods) after creating an invoice.
              type: string
          tokenProviders:
            description: List of payment token providers
            type: array
            items:
              description: |
                Payment token provider.
                The list of providers available for making payments can be found by calling the corresponding [operation](#operation/getInvoicePaymentMethods) after creating an invoice.
              type: string
          tokenProviderData:
            allOf:
              - $ref: '#/definitions/BankCardTokenProviderData'
  BankCardDetails:
    required:
      - cardNumberMask
      - paymentSystem
    properties:
      cardNumberMask:
        description: Masked card number
        type: string
        pattern: '^\d{0,6}\*+\d{0,4}$'
      first6:
        description: |
          First digits of the card number.
          Absent for tokenized payment methods.
        type: string
        pattern: '^\d{6}$'
      last4:
        description: Card last digits
        type: string
        pattern: '^\d{0,4}$'
      paymentSystem:
        description: |
          Payment system.
          The list of systems available for making payments can be found by calling the corresponding [operation](#operation/getInvoicePaymentMethods) after creating an invoice.
        type: string
      tokenProvider:
        description: |
          Payment token provider.
          The list of providers available for making payments can be found by calling the corresponding [operation](#operation/getInvoicePaymentMethods) after creating an invoice.
        type: string
      tokenizationMethod:
        description: Tokenization method
        type: string
        enum:
          - dpan
          - none
  BankCardPaymentSystem:
    description: |
      Payment system.
      The list of systems available for making payments can be found by calling the corresponding [operation](#operation/getInvoicePaymentMethods) after creating an invoice.
    type: string
  BankCardTokenizationMethod:
    description: Tokenization method
    type: string
    enum:
      - dpan
      - none
  BankCardTokenProvider:
    description: |
      Payment token provider.
      The list of providers available for making payments can be found by calling the corresponding [operation](#operation/getInvoicePaymentMethods) after creating an invoice.
    type: string
  BankCardTokenProviderData:
    type: object
    description: |
      Data for integration with payment token providers. These parameters are set in our system and can be used to build requests to the token provider or to display the payment form correctly.
    required:
      - merchantID
      - realm
    properties:
      merchantID:
        description: |
          Merchant identifier in a payment organization.
          Can be used to pass payment tokens to the provider. For example, this parameter is expected to be passed as gatewayMerchantID for GooglePay and or YandexPay and then used to bind the token to the specified shop.
        type: string
      merchantName:
        description: |
          The name of the merchant in the payment organization.
          Can be used, for example, as `merchantInfo.merchantName` in GooglePay or `merchant.name` in YandexPay or `displayName` in ApplePay.
        type: string
      orderID:
        description: |
          The identifier of the paid account in the payment organization.
          Can be used, for example, as `orderNumber` in SamsungPay or `order.id` in YandexPay.
          Using the system identifier can be useful when debugging or reconciling data with provider data.
        type: string
      realm:
        description: Payment institution's mode
        type: string
        enum:
          - test
          - live
  BrowserGetRequest:
    type: object
    allOf:
      - $ref: '#/definitions/BrowserRequest'
      - type: object
        required:
          - uriTemplate
        properties:
          uriTemplate:
            description: |
              URL value template for browser navigation
              The template is represented according to the standard [RFC6570](https://tools.ietf.org/html/rfc6570).
            type: string
  BrowserPostRequest:
    type: object
    allOf:
      - $ref: '#/definitions/BrowserRequest'
      - type: object
        required:
          - uriTemplate
          - form
        properties:
          uriTemplate:
            description: |
              URL value template for form submission
              The template is represented according to the standard [RFC6570](https://tools.ietf.org/html/rfc6570).
            type: string
          form:
            $ref: '#/definitions/UserInteractionForm'
  BrowserRequest:
    type: object
    discriminator: requestType
    required:
      - requestType
    properties:
      requestType:
        description: Type of browser operation
        type: string
  CaptureParams:
    type: object
    allOf:
      - $ref: '#/definitions/Reason'
      - type: object
        description: Data of captured payment amount
        properties:
          amount:
            description: |
              Captured payment amount, in minor monetary units, e.g. cents if US dollars are specified as the currency.
            type: integer
            format: int64
            minimum: 1
          currency:
            description: |
              Currency character code according to [ISO 4217](http://www.iso.org/iso/home/standards/currency_codes.htm).
            type: string
            pattern: '^[A-Z]{3}$'
          cart:
            description: A shopping cart with a list of items of **provided** goods or services
            type: array
            minItems: 1
            maxItems: 100
            items:
              $ref: '#/definitions/InvoiceLine'
          allocation:
            description: |
              Final cash allocation
            type: array
            minItems: 1
            maxItems: 100
            items:
              $ref: '#/definitions/AllocationTransaction'
  CardData:
    type: object
    allOf:
      - $ref: '#/definitions/PaymentTool'
      - type: object
        description: Bank card
        required:
          - cardNumber
          - expDate
        properties:
          cardNumber:
            description: Bankcard number
            type: string
            pattern: '^\d{12,19}$'
          expDate:
            description: Bank card expiration date
            type: string
            pattern: '^\d{2}\/(\d{2}|\d{4})$'
          cvv:
            description: Verification code
            type: string
            pattern: '^\d{3,4}$'
          cardHolder:
            description: Cardholder name
            type: string
            pattern: '^[[:alpha:][:space:][:punct:]]+$'
            minLength: 1
            maxLength: 100
  CardMask:
    description: Masked card number
    type: string
    pattern: '^\d{0,6}\*+\d{0,4}$'
  CashLimitBound:
    description: Cash limit bound.
    type: object
    required:
      - amount
      - inclusive
    properties:
      amount:
        type: integer
        format: int64
        minimum: 0
      inclusive:
        type: boolean
  Category:
    type: object
    required:
      - name
      - categoryID
    properties:
      name:
        type: string
        maxLength: 100
      categoryID:
        type: integer
        format: int32
      description:
        type: string
        maxLength: 1000
  Chargeback:
    type: object
    required:
      - id
      - createdAt
      - body
      - levy
      - currency
      - stage
      - status
    properties:
      id:
        description: Chargeback ID
        type: string
      createdAt:
        $ref: '#/definitions/CreatedAt'
      body:
        description: |
          Chargeback amount, in minor monetary units, e.g. cents if US dollars are specified as the currency.
        type: integer
        format: int64
        minimum: 1
      levy:
        description: |
          Chargeback levy amount, in minor monetary units, e.g. cents if US dollars are specified as the currency.
        type: integer
        format: int64
        minimum: 1
      currency:
        description: |
          Currency character code according to [ISO 4217](http://www.iso.org/iso/home/standards/currency_codes.htm).
        type: string
        pattern: '^[A-Z]{3}$'
      reasonCode:
        description: Chargeback reason code
        type: string
        maxLength: 1000
      stage:
        description: Chargeback stage
        type: string
        enum:
          - chargeback
          - pre-arbitration
          - arbitration
      status:
        description: Chargeback status
        type: string
        enum:
          - pending
          - rejected
          - accepted
          - cancelled
  ClientInfo:
    description: Payer's client device data
    type: object
    required:
      - fingerprint
    properties:
      fingerprint:
        description: Payer's user agent unique fingerprint
        type: string
        maxLength: 1000
      ip:
        description: Payer IP-address
        type: string
        format: ip-address
        maxLength: 45
      url:
        description: URL from which the payment form was received by the client
        type: string
        format: uri
        maxLength: 1000
  ContactInfo:
    description: Contact details
    type: object
    properties:
      email:
        description: Email address
        type: string
        format: email
        maxLength: 100
      phoneNumber:
        description: |
          Mobile phone number with international prefix according to [E.164](https://en.wikipedia.org/wiki/E.164).
        type: string
        format: '^\+\d{4,15}$'
      firstName:
        description: First name
        type: string
        maxLength: 100
        example: John
      lastName:
        description: Last name
        type: string
        maxLength: 100
        example: Doe
      country:
        description: |
          Alpha-3 country code by standard [ISO 3166-1](https://en.wikipedia.org/wiki/ISO_3166-1)
        type: string
        pattern: '^[A-Z]{3}$'
        example: RUS
      state:
        description: State
        type: string
        maxLength: 40
        example: Colorado
      city:
        description: City
        type: string
        maxLength: 40
        example: Denver
      address:
        description: Address
        type: string
        maxLength: 1000
        example: 10th Street 13
      postalCode:
        description: Postal code
        type: string
        maxLength: 40
        example: '00012'
      dateOfBirth:
        description: Date of birth
        type: string
        format: date
        example: '1970-01-01'
      documentId:
        description: Identity document number
        type: string
        maxLength: 40
        example: 1234-5 678-abcd
  ContinuationToken:
    description: |
      A token signaling that only a part of the data has been transmitted in the response.
      To receive the next part of the data, it is necessary to reapply to the service, specifying the same list of conditions and the received token. If there is no token, the last part of data is received.
    type: string
  CostAmountRange:
    type: object
    required:
      - upperBound
      - lowerBound
    properties:
      upperBound:
        description: An upper (inclusive) limit on the value of goods or services.
        type: integer
        format: int64
        minimum: 1
      lowerBound:
        description: A lower (inclusive) limit on the value of goods or services.
        type: integer
        format: int64
        minimum: 1
  Country:
    description: Country
    type: object
    required:
      - id
      - name
    properties:
      id:
        description: |
          Alpha-3 country code by standard [ISO 3166-1](https://en.wikipedia.org/wiki/ISO_3166-1)
        type: string
        pattern: '^[A-Z]{3}$'
        example: RUS
      name:
        type: string
        maxLength: 200
      tradeBlocs:
        type: array
        items:
          description: Trade bloc identifiers
          type: string
  CountryCode:
    description: |
      Alpha-3 country code by standard [ISO 3166-1](https://en.wikipedia.org/wiki/ISO_3166-1)
    type: string
    pattern: '^[A-Z]{3}$'
    example: RUS
  CreatedAt:
    description: Date and time of creation
    type: string
    format: date-time
  CryptoCurrency:
    description: |
      Cryptocurrency payment method.
      The list of cryptocurrencies available for making payments can be found out by calling the corresponding [operation](#operation/getInvoicePaymentMethods) after creating an invoice.
    type: string
    example: BTC
  CryptoCurrencyTransferRequest:
    type: object
    allOf:
      - $ref: '#/definitions/UserInteraction'
      - type: object
        required:
          - cryptoAddress
          - symbolicCode
          - cryptoAmount
        properties:
          cryptoAddress:
            description: Cryptocurrency wallet address
            type: string
            example: 2NBjv8rkUViGXAQar7n2BsdZjNQgupKtdPJ
          symbolicCode:
            description: Cryptocurrency symbolic code
            type: string
