            type: string
            enum:
              - ApplePay
              - GooglePay
              - SamsungPay
              - YandexPay
        required:
          - provider
  TradeBloc:
    description: Trade bloc
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
      name:
        type: string
        maxLength: 200
      description:
        type: string
        maxLength: 1000
  TransactionInfo:
    description: Transaction Info
    type: object
    properties:
      rrn:
        description: Retrieval Reference Number
        type: string
        pattern: '^[a-zA-Z0-9]{4,20}$'
      approvalCode:
        description: Authorization Approval Code
        type: string
  UserInspectContact:
    description: Customer contact information
