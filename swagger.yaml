      - email
    properties:
      email:
        description: Email address
        type: string
        format: email
        maxLength: 100
      phoneNumber:
        description: |
          Mobile phone number with international prefix according to [E.164](https://en.wikipedia.org/wiki/E.164).
        type: string
        format: '^\+\d{4,15}$'
  UserInspectCustomer:
    description: Information about client
    required:
      - contact
    properties:
      device:
