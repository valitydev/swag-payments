    required:
      - id
      - createdAt
    properties:
      id:
        description: Bank card ID
        type: string
      cardMask:
        $ref: '#/definitions/CardMask'
      createdAt:
        description: Date and time of bank card registration
        type: string
        format: date-time
  CustomerParams:
    description: Customer creation parameters
    type: object
    properties:
      partyID:
        $ref: '#/definitions/PartyID'
      externalID:
        description: External customer identifier
        type: string
        maxLength: 40
        minLength: 1
      contactInfo:
        $ref: '#/definitions/ContactInfo'
      metadata:
        description: Customer metadata
        type: object
  CustomerPayment:
    description: Customer payment information
    type: object
    required:
      - invoiceID
      - paymentID
      - createdAt
    properties:
      invoiceID:
        description: Invoice ID
        type: string
      paymentID:
        description: Payment ID
        type: string
      createdAt:
        description: Date and time of payment
        type: string
        format: date-time
  Decimal:
